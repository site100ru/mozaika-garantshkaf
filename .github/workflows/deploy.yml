name: Deploy мозаика62.рф

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Connect to server
              uses: appleboy/ssh-action@v0.1.10
              with:
                  host: ${{ secrets.MOZAIKA_HOST }}
                  username: ${{ secrets.MOZAIKA_USER }}
                  key: ${{ secrets.MOZAIKA_KEY }}
                  script: |
                      #Переключаемся в нужную папку
                      cd ~/garantshkaf.ru/public_html/wp-content/themes/mozaika-garantshkaf

                      # Клонируем репозиторий в папку (только для первой выгрузки!!!)
                      #git clone https://github.com/site100ru/mozaika-garantshkaf.git .

                      # Забираем актуальную ветку с GitHub
                      git fetch origin main

                      git reset --hard origin/main
